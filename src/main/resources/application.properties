
spring.application.name=lost-found-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lost_found_db
spring.datasource.username=macbookpro
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=YOUR_BASE64_ENCODED_SECRET_KEY_AT_LEAST_256_BITS_LONG
jwt.expiration=86400000
